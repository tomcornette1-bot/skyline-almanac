name: Probe data providers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/probe.sh", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/probe.sh
      - name: Save results to the probe-results branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir /tmp/pr && cp -r probe-results /tmp/pr/
          git checkout --orphan probe-results
          git rm -rf . -q
          cp -r /tmp/pr/probe-results .
          git add probe-results
          git commit -qm "Probe results $(date -u +%FT%TZ)"
          git push -f origin probe-results
